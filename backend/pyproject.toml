    "fastapi[standard]>=0.141.1",
    "langchain>=0.3",
    "langchain-core>=1.5.6",
    "langchain-groq>=1.1.3",
    "langgraph>=0.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2",
]
